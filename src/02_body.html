<!-- Вход / регистрация -->
<section id="gate" class="gate" aria-label="Вход в библиотеку">
  <div class="gate-left"><canvas id="board" aria-hidden="true"></canvas><div class="gate-fold"></div><div class="gate-cap" aria-hidden="true"><span id="gateCapL">расчёт</span><b id="gateCap"></b></div></div>
  <div class="gate-right">
    <div class="title-page">
      <span class="eyebrow">Закрытая библиотека</span>
      <h1 class="wordmark">Ayno<em>Book</em></h1>
      <p class="tagline">Тихое место для чтения. Каждая страница учтена, каждая закладка на своём месте, лишнего нет.</p>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <div id="gateBody" class="gate-body" aria-live="polite">
      <div style="display:flex;gap:12px;align-items:center;color:var(--muted)"><span class="loading-dots"><i></i><i></i><i></i></span> Открываю библиотеку…</div>
    </div>
  </div>
</section>

<!-- Приложение -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <button class="brand" data-go="library" aria-label="На полку"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">AynoBook</span></button>
      <nav class="tabs" id="tabs" aria-label="Разделы">
        <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
        <button class="tab" data-go="library">Полка</button>
        <button class="tab" data-go="marks">Закладки и заметки</button>
        <button class="tab" data-go="quotes">Цитаты</button>
        <button class="tab" data-go="admin" data-admin hidden>Библиотекарь</button>
      </nav>
      <div class="top-spacer"></div>
      <button class="me-chip" id="meChip" aria-label="Читательский билет"><img alt="" id="meAva"><span id="meName"></span></button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <nav class="botnav" aria-label="Разделы">
    <button data-go="library"><svg class="i"><use href="#i-shelf"/></svg>Полка</button>
    <button data-go="marks"><svg class="i"><use href="#i-ribbon"/></svg>Закладки</button>
    <button data-go="quotes"><svg class="i"><use href="#i-quote"/></svg>Цитаты</button>
    <button data-go="admin" data-admin hidden><svg class="i"><use href="#i-upload"/></svg>Книги</button>
    <button data-go="card"><svg class="i"><use href="#i-user"/></svg>Билет</button>
  </nav>
</div>

<!-- Читалка -->
<section id="reader" class="reader" hidden aria-label="Чтение" data-mode="paged" data-rtheme="auto">
  <div class="rd-top">
    <div class="rd-actions">
      <button class="icon-btn" id="rdBack" aria-label="Закрыть книгу" title="К полке (Esc)"><svg class="i"><use href="#i-back"/></svg></button>
      <button class="icon-btn" id="rdTocBtn" aria-label="Оглавление и закладки" title="Оглавление (T)"><svg class="i"><use href="#i-toc"/></svg></button>
    </div>
    <div class="rd-title"><b id="rdBook"></b><span id="rdChap"></span></div>
    <div class="rd-actions">
      <button class="icon-btn" id="rdSearchBtn" aria-label="Поиск по книге" title="Поиск (/)"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="icon-btn" id="rdSetBtn" aria-label="Оформление" title="Оформление"><svg class="i"><use href="#i-type"/></svg></button>
      <button class="icon-btn" id="rdFullBtn" aria-label="Во весь экран" title="Во весь экран (F)"><svg class="i"><use href="#i-full"/></svg></button>
      <button class="icon-btn" id="rdMarkBtn" aria-label="Заложить страницу" title="Закладка (B)"><svg class="i"><use href="#i-ribbon"/></svg></button>
    </div>
  </div>
  <div class="rd-stage" id="rdStage">
    <div class="spine" aria-hidden="true"></div>
    <div class="rd-viewport" id="rdViewport"><div class="rd-flow" id="rdFlow"></div></div>
    <div class="sweep" id="rdSweep" aria-hidden="true"></div>
    <button class="rd-ribbon" id="rdRibbon" aria-label="Убрать закладку" tabindex="-1"></button>
    <div class="rd-loading" id="rdLoading" hidden><span class="loading-dots"><i></i><i></i><i></i></span><span id="rdLoadingText">Открываю книгу…</span></div>
  </div>
  <div class="rd-bottom">
    <div class="scrub"><input type="range" id="rdScrub" min="0" max="1000" value="0" aria-label="Положение в книге"><div class="scrub-tip" id="rdTip"></div></div>
    <span class="l" id="rdLeft"></span>
    <span class="folio num" id="rdFolio"></span>
    <span class="r num" id="rdRight"></span>
  </div>

  <aside class="rd-panel" id="rdPanel" aria-label="Навигация по книге">
    <div class="rd-panel-head"><b id="rdPanelTitle">Оглавление</b><button class="icon-btn" id="rdPanelClose" aria-label="Закрыть"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="ptabs" role="tablist">
      <button role="tab" data-ptab="toc" aria-selected="true">Главы</button>
      <button role="tab" data-ptab="marks" aria-selected="false">Закладки</button>
      <button role="tab" data-ptab="notes" aria-selected="false">Выделения</button>
      <button role="tab" data-ptab="search" aria-selected="false">Поиск</button>
    </div>
    <div class="pbody" id="rdPanelBody"></div>
  </aside>

  <div class="rd-set" id="rdSet" role="dialog" aria-label="Оформление текста"></div>
  <div class="rd-pop" id="rdPop" role="toolbar" aria-label="Действия с выделением"></div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>
