<title>AynoBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#EDEFF1; --surface:#F9FAFB; --surface-2:#E2E5E9; --hover:rgba(17,19,22,.055);
  --ink:#111316; --ink-2:#3A3F46; --muted:#6A717B; --line:rgba(17,19,22,.1); --line-2:rgba(17,19,22,.2);
  --cloth:#15181C; --cloth-2:#2A2F36; --on-cloth:#F3F5F7; --cloth-soft:rgba(74,106,138,.1);
  --brass:#46678A; --gilt:#B9C6D3; --ribbon:#8E2B2F; --ok:#2F6B4E;
  --sel:rgba(74,106,138,.24); --scrim:rgba(8,9,11,.5);
  --shadow:0 1px 2px rgba(10,12,15,.06),0 10px 28px -14px rgba(10,12,15,.28);
  --shadow-lg:0 40px 80px -30px rgba(8,9,11,.5),0 8px 20px -12px rgba(8,9,11,.25);
  --f-display:"Tenor Sans","Helvetica Neue",Arial,sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.34,1.4,.5,1);
  --board:repeating-conic-gradient(#20242A 0 25%,#14171A 0 50%) 0 0/44px 44px;
  --gutter:clamp(16px,4vw,44px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0B0D; --surface:#111317; --surface-2:#191C21; --hover:rgba(232,235,238,.06);
    --ink:#E8EBEE; --ink-2:#B2B8C0; --muted:#7C848E; --line:rgba(232,235,238,.09); --line-2:rgba(232,235,238,.18);
    --cloth:#E8EBEE; --cloth-2:#FFFFFF; --on-cloth:#0A0B0D; --cloth-soft:rgba(143,176,207,.12);
    --brass:#8FB0CF; --gilt:#C9D3DD; --ribbon:#C9474D; --ok:#7CC4A0;
    --sel:rgba(143,176,207,.28); --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7);
    --shadow-lg:0 40px 80px -28px rgba(0,0,0,.85),0 8px 20px -10px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0B0D; --surface:#111317; --surface-2:#191C21; --hover:rgba(232,235,238,.06);
  --ink:#E8EBEE; --ink-2:#B2B8C0; --muted:#7C848E; --line:rgba(232,235,238,.09); --line-2:rgba(232,235,238,.18);
  --cloth:#E8EBEE; --cloth-2:#FFFFFF; --on-cloth:#0A0B0D; --cloth-soft:rgba(143,176,207,.12);
  --brass:#8FB0CF; --gilt:#C9D3DD; --ribbon:#C9474D; --ok:#7CC4A0;
  --sel:rgba(143,176,207,.28); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7);
  --shadow-lg:0 40px 80px -28px rgba(0,0,0,.85),0 8px 20px -10px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cloth);outline-offset:2px}
::selection{background:var(--sel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;letter-spacing:.01em;transition:transform .25s var(--ease),background-color .2s,border-color .2s,box-shadow .25s,color .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cloth);border-color:var(--cloth);color:var(--on-cloth)}
.btn.primary:hover{background:var(--cloth-2);border-color:var(--cloth-2);box-shadow:0 8px 20px -10px var(--cloth)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--ribbon);border-color:color-mix(in srgb,var(--ribbon) 45%,transparent);background:transparent}
.btn.danger.solid{background:var(--ribbon);color:#fff;border-color:var(--ribbon)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:999px;transition:background-color .2s,color .2s,transform .2s var(--ease);flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:var(--cloth)}
.field{display:grid;gap:6px}
.field>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;min-height:42px;padding:9px 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--cloth);box-shadow:0 0 0 3px var(--cloth-soft)}
textarea.input{min-height:88px;resize:vertical;line-height:1.45}
select.input{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:500;color:var(--ink-2);transition:all .2s var(--ease)}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- boot / gate ---------- */
.gate{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);overflow:auto}
.gate-left{position:relative;min-height:100%;overflow:hidden;background:#0A0B0D}
.gate-left canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gate-left::after{content:"";position:absolute;inset:0;box-shadow:inset -30px 0 40px -30px rgba(0,0,0,.6);pointer-events:none}
.gate-cap{position:absolute;left:24px;bottom:22px;z-index:2;display:flex;gap:12px;align-items:baseline;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:rgba(232,235,238,.72)}
.gate-cap span{text-transform:uppercase;font-size:10.5px;letter-spacing:.18em;color:rgba(143,176,207,.8)}
.gate-cap b{font-weight:500;color:#E8EBEE;transition:opacity .3s}
.gate-fold{position:absolute;right:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18));pointer-events:none}
.gate-right{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,88px);gap:28px;min-height:100%;position:relative}
.title-page{display:grid;gap:10px;animation:rise .9s var(--ease) both}
.title-page .eyebrow{color:var(--brass)}
.wordmark{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:clamp(56px,8vw,104px);line-height:.9;letter-spacing:-.01em;margin:0}
.wordmark .yo{position:relative}
.tagline{font-size:16px;color:var(--ink-2);max-width:34ch;margin:0}
.rule{height:1px;background:var(--line-2);width:100%;max-width:420px;position:relative}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--ink);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 8px var(--bg)}
.gate-body{display:grid;gap:18px;max-width:420px;animation:rise .9s .12s var(--ease) both}
.gate-body h2{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;margin:0}
.gate-body p{margin:0;color:var(--ink-2)}
.fineprint{font-size:12.5px;color:var(--muted);line-height:1.5}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);position:relative;transition:transform .25s var(--spring);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.9)}
.loading-dots{display:inline-flex;gap:6px}
.loading-dots i{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:dot 1.1s infinite var(--ease-io)}
.loading-dots i:nth-child(2){animation-delay:.15s}.loading-dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* library card (читательский билет) */
.lcard{position:relative;border-radius:14px;padding:20px 22px 18px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);display:grid;gap:14px;overflow:hidden;max-width:420px}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--rib,var(--ribbon))}
.lcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lcard-top .eyebrow{font-size:10.5px}
.lcard-no{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--brass)}
.lcard-name{display:flex;align-items:center;gap:14px}
.lcard-name img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2)}
.lcard-name b{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.05;display:block;overflow-wrap:anywhere}
.lcard-name small{color:var(--muted);font-size:12.5px}
.lcard-lines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px dashed var(--line-2);padding-top:12px}
.lcard-lines div{display:grid;gap:2px}
.lcard-lines b{font-size:18px;font-weight:600}
.lcard-lines small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stamp{position:absolute;right:16px;bottom:52px;width:84px;height:84px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ribbon) 70%,transparent);color:color-mix(in srgb,var(--ribbon) 80%,transparent);display:grid;place-items:center;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:rotate(-14deg);line-height:1.2;pointer-events:none;opacity:.8}
.stamp::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid currentColor}
.stamp.hit{animation:stamp .55s var(--spring) both}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.2);opacity:0}60%{opacity:.9}100%{transform:rotate(-14deg) scale(1);opacity:.8}}

/* ---------- app shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:0 var(--gutter);height:64px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:22px;height:22px;border:1.5px solid var(--ink);background:conic-gradient(var(--ink) 0 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0);transition:transform .5s var(--spring)}
.brand:hover .brand-mark{transform:rotate(90deg)}
.brand-name{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:27px;line-height:1}
.tabs{display:flex;gap:4px;position:relative;margin-left:8px}
.tab{height:38px;padding:0 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;transition:color .2s,background-color .2s;position:relative;z-index:1}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--on-cloth)}
.tab-ind{position:absolute;top:0;height:38px;border-radius:999px;background:var(--cloth);transition:left .45s var(--spring),width .45s var(--spring);z-index:0}
.top-spacer{flex:1}
.me-chip{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);transition:border-color .2s,background-color .2s}
.me-chip:hover{border-color:var(--line-2);background:var(--hover)}
.me-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.me-chip span{font-weight:500;font-size:14px;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip .local-dot{width:7px;height:7px;border-radius:50%;background:var(--brass)}
.botnav{display:none}
main.view{max-width:1320px;margin:0 auto;padding:28px var(--gutter) 80px;display:grid;gap:40px}
.view-enter{animation:rise .55s var(--ease) both}

/* ---------- hero ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(200px,300px) 1fr;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);min-height:300px}
.hero-end{position:relative;background:radial-gradient(ellipse at 50% 45%,rgba(10,11,13,0) 20%,rgba(10,11,13,.75) 100%),var(--board);display:grid;place-items:center;padding:28px}
.hero-end::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.28));pointer-events:none}
.hero-end .book{width:min(150px,60%);transform:rotate(-4deg);transition:transform .6s var(--spring)}
.hero:hover .hero-end .book{transform:rotate(-1deg) translateY(-4px)}
.hero-text{padding:30px clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.hero-title{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,4.2vw,50px);line-height:1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.hero-author{color:var(--ink-2);font-size:16px;margin:0}
.hero-where{color:var(--muted);font-size:14px;margin:0}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative;max-width:460px}
.progress>i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,var(--cloth),var(--brass));width:0;transition:width 1.2s var(--ease)}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.hero-stats b{color:var(--ink);font-weight:600}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* ---------- shelf ---------- */
.shelf-head{display:flex;align-items:end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.shelf-head h2{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1;margin:0;display:flex;align-items:baseline;gap:12px}
.shelf-head h2 small{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--muted)}
.shelf-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;min-width:0;flex:1 1 220px;max-width:320px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search .input{padding-left:38px;border-radius:999px;min-height:38px}
.shelf-tools select.input{width:auto;min-height:38px;border-radius:999px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 26px}
.tile{display:grid;gap:12px;text-align:left;align-content:start;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms);perspective:900px;border-radius:8px}
.tile:focus-visible{outline-offset:6px}
.book{position:relative;display:block;container-type:inline-size;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 7px 7px 3px;transform-style:preserve-3d;transition:transform .55s var(--spring),box-shadow .45s var(--ease);box-shadow:0 1px 1px rgba(0,0,0,.08),0 12px 22px -12px rgba(10,18,15,.55)}
.tile:hover .book,.tile:focus-visible .book{transform:translateY(-8px) rotateY(-14deg) rotateZ(-.4deg);box-shadow:14px 26px 36px -18px rgba(10,18,15,.6)}
.cover{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:var(--cc,#1F4D45);display:flex;flex-direction:column;justify-content:space-between;padding:14% 12% 12%;color:#DDE3E9;font-size:12px;font-size:8.5cqw;text-align:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.14) 55%,rgba(0,0,0,.08));z-index:2}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.12),transparent 38%,transparent 70%,rgba(0,0,0,.14));z-index:2;pointer-events:none}
.cover.gen{background-image:linear-gradient(165deg,rgba(255,255,255,.08),transparent 45%),linear-gradient(0deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:auto,100% 12.5%}
.cover.gen .frame{position:absolute;inset:7% 8% 7% 11%;border:1px solid rgba(221,227,233,.42)}
.cover .ct{position:relative;z-index:1;font-family:var(--f-display);font-weight:600;font-size:var(--ts,1.55em);line-height:1.04;hyphens:auto;-webkit-hyphens:auto;text-align:center;text-wrap:balance;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;padding-left:6%}
.cover .ca{position:relative;z-index:1;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:.85;padding-left:6%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover .orn{position:relative;z-index:1;text-align:center;font-size:.9em;opacity:.8;padding-left:6%}
.mini-rib{position:absolute;top:-3px;right:14%;width:12px;height:30px;background:var(--rib,var(--ribbon));clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);z-index:3;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.tile-meta{display:grid;gap:3px;min-width:0}
.t-title{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-author{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-state{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
.t-state .progress{flex:1;height:4px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--cloth-soft);color:var(--cloth)}
.badge.gilt{background:color-mix(in srgb,var(--brass) 16%,transparent);color:var(--brass)}
.badge.muted{background:var(--surface-2);color:var(--muted)}
.empty{display:grid;justify-items:center;text-align:center;gap:14px;padding:64px 20px;border:1.5px dashed var(--line-2);border-radius:20px}
.empty h3{font-family:var(--f-display);font-size:30px;font-weight:600;margin:0;line-height:1.1}
.empty p{margin:0;color:var(--ink-2);max-width:46ch}
.empty .shelf-art{width:200px;height:90px;position:relative}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fadein .3s both}
.scrim.out{animation:fadein .25s reverse both}
.sheet{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slidein .5s var(--ease) both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.out{animation:slideout .3s var(--ease-io) both}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideout{to{transform:translateX(100%)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 24px;border-bottom:1px solid var(--line)}
.sheet-body{overflow:auto;padding:24px;display:grid;gap:22px;align-content:start}
.sheet-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.detail-top{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:end}
.detail-top h2{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.02;margin:0 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.detail-top p{margin:0;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{padding:12px 14px;display:grid;gap:2px}
.facts div+div{border-left:1px solid var(--line)}
.facts b{font-size:17px;font-weight:600}
.facts small{font-size:11.5px;color:var(--muted)}
.desc{color:var(--ink-2);line-height:1.6;margin:0;white-space:pre-line}
.toc-list{display:grid;gap:0;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.toc-list button{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
.toc-list button:last-child{border-bottom:0}
.toc-list button:hover{background:var(--hover)}
.toc-list .lv2{padding-left:30px;color:var(--ink-2)}
.toc-list .lv3{padding-left:46px;color:var(--ink-2);font-size:13.5px}
.toc-list .cur{color:var(--cloth);font-weight:600}
.section-t{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* ---------- marks list ---------- */
.marks-group{display:grid;gap:12px}
.marks-book{display:flex;align-items:center;gap:14px}
.marks-book .book{width:44px;flex:none;box-shadow:0 6px 12px -8px rgba(0,0,0,.5)}
.marks-book h3{margin:0;font-size:17px;font-weight:600}
.marks-book p{margin:0;color:var(--muted);font-size:13px}
.mark-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.mark{display:grid;gap:8px;text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .2s,box-shadow .3s;position:relative;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.mark:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}
.mark-q{font-family:"Literata",Georgia,serif;font-size:15px;line-height:1.55;margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mark-q.hl{padding-left:12px;border-left:3px solid var(--hlc)}
.mark-note{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:8px;margin:0;white-space:pre-wrap}
.mark-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.mark .kind{display:inline-flex;gap:6px;align-items:center}
.mark .kind i{width:9px;height:14px;background:var(--rib,var(--ribbon));clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.mark .kind i.sw{width:10px;height:10px;border-radius:3px;clip-path:none;background:var(--hlc)}

/* ---------- admin ---------- */
.drop{position:relative;display:grid;justify-items:center;text-align:center;gap:12px;padding:44px 24px;border-radius:20px;border:1.5px dashed var(--line-2);background:var(--surface);transition:border-color .25s,background-color .25s,transform .35s var(--spring);overflow:hidden}
.drop.over{border-color:var(--cloth);background:var(--cloth-soft);transform:scale(1.01)}
.drop h3{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0;line-height:1.1}
.drop p{margin:0;color:var(--ink-2)}
.drop .formats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.drop .formats span{font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.drop-books{display:flex;gap:6px;align-items:flex-end;height:64px}
.drop-books i{width:14px;border-radius:2px 2px 1px 1px;background:var(--c);animation:bob 3.2s var(--ease-io) infinite;animation-delay:var(--d)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.queue{display:grid;gap:14px}
.qitem{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);animation:rise .5s var(--ease) both}
.qitem .book{width:96px}
.qform{display:grid;gap:12px;min-width:0}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qstat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.qstat b{color:var(--ink);font-weight:600}
.qwarn{font-size:13px;color:var(--brass)}
.qerr{font-size:13.5px;color:var(--ribbon)}
.qactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:4px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--cloth);transition:width .3s var(--ease)}
.bar.ind i{width:35%;animation:ind 1.1s var(--ease-io) infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.admin-cols{display:grid;gap:40px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.books{width:100%;border-collapse:collapse;min-width:640px}
table.books th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
table.books td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
table.books tr:last-child td{border-bottom:0}
table.books .bk{display:flex;gap:14px;align-items:center;min-width:220px}
table.books .bk .book{width:38px;flex:none}
table.books .bk b{display:block;font-weight:600}
table.books .bk small{color:var(--muted)}
table.books .acts{display:flex;gap:4px;justify-content:flex-end}
.confirm{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:13px}
.hint{display:flex;gap:14px;padding:16px 18px;border-radius:14px;background:var(--cloth-soft);color:var(--ink-2);font-size:14px;line-height:1.55}
.hint svg{color:var(--cloth);margin-top:2px}
.hint b{color:var(--ink)}
.meter{display:grid;gap:6px;font-size:13px;color:var(--muted)}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:toast .45s var(--spring) both;pointer-events:auto;max-width:100%}
.toast.out{animation:toastout .3s var(--ease-io) both}
@keyframes toast{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}

/* ---------- opening animation ---------- */
.opening{position:fixed;z-index:70;perspective:1800px;pointer-events:none}
.opening .ob{position:absolute;inset:0;transform-style:preserve-3d}
.opening .ob-end{position:absolute;inset:0;border-radius:2px 6px 6px 2px;background:#F7F5EF;box-shadow:var(--shadow-lg),inset 10px 0 18px -12px rgba(0,0,0,.35);display:grid;place-items:center;container-type:inline-size;overflow:hidden}
.ob-tp{display:grid;justify-items:center;gap:5cqw;text-align:center;color:#1E1D1A;padding:12cqw}
.ob-tp small{font-size:4.6cqw;letter-spacing:.16em;text-transform:uppercase;color:#6d6a60}
.ob-tp b{font-family:var(--f-display);font-weight:600;font-size:11cqw;line-height:1.04;text-wrap:balance;overflow-wrap:anywhere}
.ob-tp i{font-style:normal;color:#8E6718;font-size:8cqw}
.ob-tp span{font-size:4.4cqw;color:#6d6a60;opacity:0;transition:opacity .4s}
.opening.slow .ob-tp span{opacity:1}
.opening .ob-cover{position:absolute;inset:0;transform-origin:left center;transition:transform .9s cubic-bezier(.65,0,.35,1);transform-style:preserve-3d}
.opening .cq{position:absolute;inset:0;container-type:inline-size;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.opening .cq .cover{border-radius:3px 7px 7px 3px;box-shadow:var(--shadow-lg)}
.opening.open .ob-cover{transform:rotateY(-170deg)}
.opening .ob-back{position:absolute;inset:0;background:var(--board);border-radius:7px 3px 3px 7px;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset -10px 0 18px -10px rgba(0,0,0,.4)}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--r-bg);color:var(--r-ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background-color .4s,color .4s;
  --r-bg:var(--surface);--r-ink:var(--ink);--r-muted:var(--muted);--r-line:var(--line);--r-acc:var(--cloth);--r-panel:var(--bg);--r-sel:var(--sel);--r-hover:var(--hover)}
.reader.enter{animation:fadein .45s var(--ease) both}
.reader[data-rtheme="paper"]{color-scheme:light;--r-bg:#F7F5EF;--r-ink:#1F1E1A;--r-muted:#7C786E;--r-line:rgba(31,30,26,.12);--r-acc:#1F4D45;--r-panel:#FDFCF8;--r-sel:rgba(196,151,58,.3);--r-hover:rgba(31,30,26,.06)}
.reader[data-rtheme="sepia"]{color-scheme:light;--r-bg:#EFE3CA;--r-ink:#3B2E1F;--r-muted:#86745B;--r-line:rgba(59,46,31,.15);--r-acc:#7A4B1C;--r-panel:#F6ECD8;--r-sel:rgba(160,110,40,.28);--r-hover:rgba(59,46,31,.07)}
.reader[data-rtheme="mist"]{color-scheme:light;--r-bg:#DCE3DE;--r-ink:#1A2622;--r-muted:#5F6E68;--r-line:rgba(26,38,34,.14);--r-acc:#1F4D45;--r-panel:#E7ECE8;--r-sel:rgba(31,77,69,.2);--r-hover:rgba(26,38,34,.07)}
.reader[data-rtheme="night"]{color-scheme:dark;--r-bg:#131915;--r-ink:#C9D2CC;--r-muted:#7E8C85;--r-line:rgba(201,210,204,.12);--r-acc:#7FC0AF;--r-panel:#19211D;--r-sel:rgba(127,192,175,.25);--r-hover:rgba(201,210,204,.07)}
.reader[data-rtheme="ink"]{color-scheme:dark;--r-bg:#000;--r-ink:#A9B1AC;--r-muted:#6D7571;--r-line:rgba(169,177,172,.14);--r-acc:#D9B060;--r-panel:#0B0D0C;--r-sel:rgba(217,176,96,.25);--r-hover:rgba(169,177,172,.08)}
.reader ::selection{background:var(--r-sel)}
.rd-top{height:54px;display:flex;align-items:center;gap:2px;padding:0 10px;position:relative;z-index:6}
.rd-top .icon-btn:hover,.rd-bottom .icon-btn:hover{background:var(--r-hover)}
.rd-actions{display:flex;align-items:center;gap:2px;transition:opacity .35s var(--ease)}
.rd-title{flex:1;min-width:0;text-align:center;display:grid;gap:0;line-height:1.2;padding:0 8px}
.rd-title b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s}
.rd-title span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--r-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader.immersive .rd-actions{opacity:0;pointer-events:none}
.reader.immersive .rd-title b{opacity:0}
.rd-stage{position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;touch-action:pan-y}
.rd-viewport{position:relative;overflow:hidden;height:100%}
.rd-flow{position:relative;will-change:transform;transition:opacity .17s ease;font-family:var(--rf,"Literata",Georgia,serif);font-size:var(--rfs,19px);line-height:var(--rlh,1.6);text-align:var(--ralign,justify);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;orphans:2;widows:2;color:var(--r-ink)}
.rd-flow.slide{transition:transform .5s cubic-bezier(.25,.8,.25,1),opacity .17s ease}
.rd-flow.fading{opacity:0}
.rd-flow>*{margin-top:0}
.rd-flow p{margin:0;text-indent:1.5em}
.rd-flow.spaced p{text-indent:0;margin-bottom:.75em}
.rd-flow h2,.rd-flow h3,.rd-flow h4,.rd-flow h5{font-family:var(--f-display);font-weight:600;text-align:center;text-indent:0;hyphens:manual;-webkit-hyphens:manual;break-after:avoid;text-wrap:balance;line-height:1.12}
.rd-flow h2{font-size:1.85em;margin:1.4em 0 1.1em}
.rd-flow h2:first-child{margin-top:1.8em}
.rd-flow h3{font-size:1.4em;margin:1.2em 0 .8em}
.rd-flow h4{font-size:1.2em;margin:1em 0 .6em}
.rd-flow h5{font-size:1.05em;margin:1em 0 .5em}
.rd-flow h2+p,.rd-flow h3+p{text-indent:0}
.rd-flow h2+p:not(.epi):not(.ta):not(.v):not(.q):not(.li):not(.sub):not(.pt):not(.note-t)::first-letter{float:left;font-family:var(--f-display);font-weight:600;font-size:3.4em;line-height:.78;padding:.1em .08em 0 0;color:var(--r-acc)}
.rd-flow p.epi{margin:0 0 .2em 28%;text-indent:0;font-style:italic;font-size:.92em;text-align:left}
.rd-flow p.ta{text-align:right;font-style:italic;text-indent:0;margin-bottom:1em;font-size:.92em}
.rd-flow p.v{text-indent:0;margin:0 0 1em 10%;text-align:left;hyphens:manual}
.rd-flow p.q{margin:0 1em 0 1.6em;text-indent:0;font-size:.95em}
.rd-flow p.pt{text-align:center;font-weight:600;text-indent:0;margin:1em 0 .6em}
.rd-flow p.sub{text-align:center;font-weight:600;text-indent:0;margin:1.1em 0 .7em}
.rd-flow p.li{text-indent:0;padding-left:1.5em;position:relative;text-align:left}
.rd-flow p.li::before{content:"•";position:absolute;left:.45em;color:var(--r-muted)}
.rd-flow p.li.ol::before{content:none}
.rd-flow p.li .n{position:absolute;left:0;color:var(--r-muted)}
.rd-flow p.note-t{text-indent:0;margin-top:.8em}
.rd-flow hr{border:0;height:1.6em;margin:.9em 0;text-align:center;overflow:visible;break-after:avoid}
.rd-flow hr::after{content:"⁂";font-size:1.1em;color:var(--r-muted);line-height:1.6em}
.rd-flow figure{margin:.8em 0;text-align:center;break-inside:avoid;text-indent:0}
.rd-flow img{max-width:100%;height:auto;max-height:var(--vh,80vh);object-fit:contain;vertical-align:middle}
.rd-flow sup.nr{font-size:.7em;color:var(--r-acc);font-weight:600}
.rd-flow pre{white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.82em;text-align:left;hyphens:manual;margin:.6em 0}
.rd-flow .tbl{overflow-x:auto;margin:.8em 0;text-indent:0;break-inside:avoid}
.rd-flow table{border-collapse:collapse;font-size:.85em;text-align:left}
.rd-flow td,.rd-flow th{border:1px solid var(--r-line);padding:.3em .55em;vertical-align:top;text-indent:0}
.rd-flow.part>.blk:first-child{margin-top:calc(var(--vh,600px)*.28)}
.rd-flow mark.hl{color:inherit;background:var(--hlc);border-radius:2px;cursor:pointer;transition:background-color .3s;padding:.05em 0}
.rd-flow mark.hl.note{background-image:linear-gradient(transparent 88%,var(--r-acc) 88%)}
.rd-flow mark.find{color:inherit;background:rgba(217,176,96,.55);border-radius:2px;animation:flash 1.6s ease both}
@keyframes flash{0%,40%{background:rgba(217,176,96,.85)}100%{background:rgba(217,176,96,.3)}}
.rd-flow .ch-end{margin-top:2.5em;text-align:center;text-indent:0;display:grid;gap:10px;justify-items:center;font-family:var(--f-ui);font-size:14px;color:var(--r-muted)}
.spine{position:absolute;top:0;bottom:0;left:50%;width:48px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.05) 42%,rgba(0,0,0,.09) 50%,rgba(0,0,0,.05) 58%,transparent);opacity:0;transition:opacity .4s}
.reader[data-rtheme="night"] .spine,.reader[data-rtheme="ink"] .spine{background:linear-gradient(90deg,transparent,rgba(0,0,0,.35) 50%,transparent)}
.reader.two .spine{opacity:1}
.sweep{position:absolute;top:0;bottom:0;width:120px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.07),transparent);opacity:0}
.sweep.go-next{animation:sweepn .5s ease-out}
.sweep.go-prev{animation:sweepp .5s ease-out}
@keyframes sweepn{from{right:-120px;opacity:1}to{right:100%;opacity:0}}
@keyframes sweepp{from{left:-120px;opacity:1}to{left:100%;opacity:0}}
.rd-ribbon{position:absolute;top:0;width:22px;height:74px;background:var(--rib,#9E2B37);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);transform:translateY(-110%);transition:transform .55s var(--spring);z-index:4;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer}
.rd-ribbon::after{content:"";position:absolute;inset:0 0 auto 0;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 40%,rgba(0,0,0,.15))}
.rd-ribbon.on{transform:none}
.rd-bottom{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 20px;font-size:12.5px;color:var(--r-muted);position:relative;z-index:6}
.rd-bottom .l{justify-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rd-bottom .r{justify-self:end;white-space:nowrap}
.folio{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--r-ink);letter-spacing:.08em}
.scrub{position:absolute;left:20px;right:20px;top:0;height:18px;display:flex;align-items:center;transition:opacity .35s}
.reader.immersive .scrub{opacity:0;pointer-events:none}
.reader.immersive .rd-bottom .l,.reader.immersive .rd-bottom .r{opacity:.55}
.scrub input{width:100%;margin:0;appearance:none;-webkit-appearance:none;height:18px;background:transparent;cursor:pointer}
.scrub input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--r-acc) var(--p,0%),var(--r-line) var(--p,0%))}
.scrub input::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--r-acc) var(--p,0%),var(--r-line) var(--p,0%))}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--r-acc);margin-top:-5.5px;border:2px solid var(--r-bg);transition:transform .2s}
.scrub input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--r-acc);border:2px solid var(--r-bg)}
.scrub input:active::-webkit-slider-thumb{transform:scale(1.3)}
.scrub-tip{position:absolute;bottom:22px;transform:translateX(-50%);background:var(--r-ink);color:var(--r-bg);padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.scrub-tip.on{opacity:1}
.reader[data-mode="scroll"] .rd-viewport{overflow-y:auto;overflow-x:hidden;width:100%!important;display:flex;justify-content:center;scrollbar-gutter:stable}
.reader[data-mode="scroll"] .rd-flow{transform:none!important;height:auto!important;columns:auto!important;padding:1em 0 45vh}
.reader[data-mode="scroll"] .rd-ribbon{display:none}

/* panels inside reader */
.rd-panel{position:absolute;z-index:20;top:0;bottom:0;left:0;width:min(400px,100%);background:var(--r-panel);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(-104%);transition:transform .45s var(--ease);border-right:1px solid var(--r-line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rd-panel.on{transform:none}
.rd-panel-head{display:flex;align-items:center;gap:6px;padding:10px 10px 0 16px}
.rd-panel-head b{font-family:var(--f-display);font-size:22px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptabs{display:flex;gap:2px;padding:10px 12px;border-bottom:1px solid var(--r-line)}
.ptabs button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--r-muted);transition:all .2s}
.ptabs button[aria-selected="true"]{background:var(--r-hover);color:var(--r-ink)}
.pbody{overflow:auto;flex:1;padding:6px 0 20px}
